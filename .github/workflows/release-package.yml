name: Release package

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm trusted publisher OIDC
      contents: write # required to push the version commit and tag

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: pnpm version ${{ github.event.inputs.release_type }}

      - name: Build
        run: pnpm tsc --project tsconfig-release.json

      - name: Push version commit and tag
        run: git push --follow-tags

      - name: Publish to NPM
        run: pnpm publish --no-git-checks --access public
