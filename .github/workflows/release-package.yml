name: Release package

on:
  workflow_dispatch:
    inputs:
      package:
        type: choice
        description: "Select a package"
        required: true
        default: "ontologic"
        options:
          - "ontologic"
          - "postgres"

      release_type:
        description: Release type
        type: choice
        required: true
        default: "patch"
        options:
          - "patch"
          - "minor"
          - "major"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm trusted publisher OIDC
      contents: write # required to push the version commit and tag

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          scope: ontologic
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: pnpm version ${{ github.event.inputs.release_type }}

      - name: Build
        run: pnpm release --filter=@ontologic/${{ github.event.inputs.package }}

      - name: Push version commit and tag
        run: git push --follow-tags

      - name: Publish to NPM
        run: pnpm publish --no-git-checks --access public --workspace=@ontologic/${{ github.event.inputs.package }}
